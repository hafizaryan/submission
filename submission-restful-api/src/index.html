<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App</title>
</head>

<body>
  <div id="app">
    <h1>Hafiz's Notes App</h1>
    <div id="loading-indicator" style="display: none;">Loading...</div>
    <div id="notes-list"></div>
    <button id="show-notes">Show Notes</button>
    <button id="show-archived">Show Archived</button>
    <form id="note-form">
      <input type="text" id="note-title" placeholder="Title" required>
      <textarea id="note-body" placeholder="Body" required></textarea>
      <button type="submit">Add Note</button>
    </form>
  </div>
</body>

</html>
